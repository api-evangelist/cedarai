          type: string
        precooled:
          type: boolean
        heaterLocation:
          type: string
          enum:
          - Y
          - N
        commodityType:
          type: string
          enum:
          - Y
          - N
        doorwaySpace:
          type: string
          enum:
          - Y
          - N
        originTemperature:
          type: number
    SingleGroupingOutput:
      allOf:
      - $ref: '#/components/schemas/Grouping'
      - type: object
        properties:
          carrierId:
            type: integer
            description: Carrier identifier associated with the grouping.
    EquipmentTrackUpdate:
      type: object
      properties:
        from:
          $ref: '#/components/schemas/InventoryLocation'
          description: Source location. May include grouping.resourceId (track) and optional spot name.
        to:
          $ref: '#/components/schemas/InventoryLocation'
          description: Destination location. Use grouping.resourceId (track) and optional groupingIndex to control position (0 = front, -1 = back).
    GroupingIdFilter:
      type: object
      properties:
        leafGroupingType:
          type: string
          description: When querying nested groups, such as yard config, the grouping type of leaf nodes need to be specified as a target to locate the right grouping equipment association. Leave it None, if equipment are directly associated with the groups that you are searching for.
        groupingType:
          type: string
          description: The type of grouping to filter by.
        groupingIds:
          type: array
          items:
            type: integer
          description: List of grouping IDs to filter by.
      required:
      - groupingType
      - groupingIds
      additionalProperties: false
    ListInventoryInput:
      type: object
      properties:
        pageSize:
          type: integer
          minimum: 1
          description: Number of items per page. Use with pageNextToken/pagePrevToken for pagination.
        pageNextToken:
          type: string
          description: Token to fetch the next page of results returned from a previous call.
        pagePrevToken:
          type: string
          description: Token to fetch the previous page of results returned from a previous call.
        initialAndNumber:
          type: string
          description: Filter by equipment initial and number (e.g., 'XYZ 123456').
        loadStatus:
          type: string
          description: Filter by derived load status.
          enum:
          - LOAD
          - EMPTY
          - UNKNOWN
        aarCarType:
          type: string
          description: Filter by AAR car type (e.g., GONDOLA).
        station:
          type: integer
          description: Filter by station ID. Obtain IDs from the listStationTracks endpoint.
        track:
          type: integer
          description: Filter by track ID. Obtain IDs from the listStationTracks endpoint.
        tag:
          type: integer
          description: Filter by tag ID. Obtain IDs from the listStationTracks endpoint.
        shipper:
          type: string
          description: Filter by shipper name.
        consignee:
          type: string
          description: Filter by consignee name.
        arrivalState:
          type: array
          description: Filter by arrival state of equipment.
          items:
            type: string
            description: Arrival state value.
            enum:
            - INBOUND
            - ONLINE
            - OUTBOUND
        carrierId:
          type: integer
          description: Carrier identifier. May also be supplied via query parameter.
        equipmentId:
          type: integer
          description: Filter by a single equipment resourceId.
        equipmentIds:
          type: array
          description: Filter by multiple equipment resourceIds.
          items:
            type: integer
        equipmentInitial:
          type: string
          description: Filter by equipment initial prefix (e.g., 'ABC').
        equipmentInitialsAndNumbers:
          type: array
          description: Filter by explicit tuples of equipment initial and number (e.g., [["ABC", 123], ["DEF", 456]]).
          items:
            $ref: '#/components/schemas/InitialAndNumber'
        equipmentNumber:
          type: integer
          description: Filter by equipment number.
        trainId:
          type: string
          description: Filter by train ID.
        includeTrain:
          type: boolean
          description: Whether to include train information in the response.
        intersectedGroupFilters:
          type: array
          description: 'Intersect all grouping filters to get grouping IDs. For example, can specify multiple filters at once, such as zone, station, track. In this case, it expands zone and station to track level and intersects them with each other.


            This field is mutually exclusive with the legacy grouping fields (station, track, tag).'
          items:
            anyOf:
            - $ref: '#/components/schemas/GroupingIdFilter'
            - $ref: '#/components/schemas/GroupingNameFilter'
        consistUuid:
          type: string
          description: Filter by consist UUID. This is used with includeSwitchRequest to get all of the equipment on a consist.
        includeSwitchRequest:
          type: boolean
          description: Whether to include switch request information.
        includeTripPlan:
          type: boolean
          description: Whether to include trip-plan-derived priorities (currentStopPriority and nextStopPriority) in the response, matching the priorities shown on the Inventory page. Requires the carrier to have trip plans enabled.
    CreateChargedHistoryInstance:
      type: object
      properties:
        equipmentId:
          type: integer
          description: Equipment resourceId for which to create a charge history record.
        chargeGroupId:
          type: integer
          description: Charge group (e.g., billing category) applied to the record.
        timestamp:
          type: string
          format: date-time
          description: Timestamp of the record (ISO 8601).
      required:
      - equipmentId
      - chargeGroupId
      - timestamp
    CustomerLocationResource:
      type: object
      properties:
        resourceId:
          type: integer
        uuid:
          type: string
        name:
          type: string
        blockCode:
          type: string
        customerBlock:
          $ref: '#/components/schemas/GroupingResource'
        customer:
          $ref: '#/components/schemas/CustomerResource'
        carrier:
          $ref: '#/components/schemas/CarrierResource'
        groupings:
          type: array
          items:
            $ref: '#/components/schemas/GroupingResource'
        abbreviatedName:
          type: string
        currencyCode:
          type: string
    DeleteChargedHistoryInstance:
      type: object
      properties:
        historyItemId:
          type: integer
          description: Identifier of the charged history item to delete.
      required:
      - historyItemId
    CreateBillOfLadingInput:
      type: object
      properties:
        carrierId:
          type: integer
        waybill:
          $ref: '#/components/schemas/Waybill'
    Release:
      type: object
      properties:
        releaseCode:
          type: string
          enum:
          - B
          - R
        releaseDate:
          type: string
        releaseTime:
          type: string
    EPARequiredData:
      type: object
      properties:
        epaWasteStreamNumberCode:
          type: string
        wasteCharacteristicsCode:
          type: string
        hazardousWasteNumberStateOrProvince:
          type: string
        hazardousWasteNumber:
          type: string
    ListStationTracksInput:
      type: object
      properties:
        carrierId:
          type: integer
          description: Carrier identifier used to scope stations and tracks.
    BulkEditChargedHistoryOutput:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/EquipmentHistoryItem'
    TransborderHazardousRequirements:
      type: object
      properties:
        hazardousClassification:
          type: string
        hazardousPlacardNotation:
          type: string
        hazardousEndorsement:
          type: string
    ListCustomersInput:
      type: object
      required:
      - carrierId
      properties:
        carrierId:
          type: integer
          description: Carrier identifier. May also be supplied via query parameter.
        customerIds:
          type: array
          items:
            type: integer
          description: Optional filter by specific customer IDs
        customerUuids:
          type: array
          items:
            type: string
          description: Optional filter by specific customer UUIDs
        includeShipperCustomers:
          type: boolean
          description: Whether to include shipper customers
          default: false
    ToolsWorkLoadEquipmentInput:
      type: object
      properties:
        carrierId:
          type: integer
          description: Carrier identifier for the load.
        details:
          type: array
          description: List of equipment and attributes to load.
          items:
            $ref: '#/components/schemas/ToolsWorkLoadEquipmentDetails'
        trackName:
          type: string
          description: Track name where toolswork is loaded.
        timestamp:
          type: string
          description: Optional timestamp of the load event.
        waybillTemplateId:
          type: integer
          description: Waybill template identifier to use for the load.
      required:
      - carrierId
      - details
      - trackName
      - waybillTemplateId
    ListCustomersOutput:
      type: object
      properties:
        customers:
          type: array
          items:
            $ref: '#/components/schemas/CustomerOutput'
        contract:
          type: object
          properties:
            effect:
              type: string
              enum:
              - overwrite
            resourceType:
              type: string
              enum:
              - Customer
  parameters:
    ViewAsUserGroup:
      name: viewAsUserGroup
