    ClassifyClassListInput:
      type: object
      description: Input for classifying a class list (switch list) from a list of car numbers.
      properties:
        carrierId:
          type: integer
          description: Carrier identifier.
        equipmentInitialAndNumbers:
          type: array
          minItems: 1
          description: Equipment initial and numbers to classify, e.g. ['BNSF 999001', 'UP 999010']. Order is preserved in the resulting class list and is also used for capacity accounting.
          items:
            type: string
        scope:
          type: string
          description: Block-to-track scope to use. Real-world scopes are usually named after the lead and shift the crew is working (for example `yard1_first_shift` or `mainyard_lead_morning`). If omitted, the first scope accessible to the caller is used. Values that do not start with `block2track_` are automatically prefixed (so `yard1_first_shift` and `block2track_yard1_first_shift` are equivalent). A scope that is not configured for the carrier is rejected with `400 Bad Request`.
        jobId:
          type: string
          description: User-specified label for the class list. Carriers commonly pass the train or job number the crew is working (for example `350` or `MORNING-JOB-12`). If omitted, a label like `Classify <UTC timestamp>` is generated.
        isBack:
          type: boolean
          description: True if switching from the back of the track. Defaults to false.
          default: false
      required:
      - carrierId
      - equipmentInitialAndNumbers
