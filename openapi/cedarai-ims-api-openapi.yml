        '401':
          description: Unauthorized
        '500':
          description: Internal Server Error
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      tags:
      - Ims
  /ims/work-orders/tasks/complete:
    post:
      summary: Complete class list tasks
      description: 'Marks one or more class list tasks as completed.


        Usage notes:

        - Each item in the request specifies a taskId and optionally a finalTrackId (the track the equipment was moved to).

        - When all tasks on a class list are completed, the class list is automatically archived.

        - Use this endpoint after moving equipment (via the Move Equipment API) to mark the corresponding class list tasks as done.

        - The completedAt timestamp defaults to the current time if not specified.'
      operationId: completeClassListTasks
      parameters:
      - $ref: '#/components/parameters/CarrierId'
      - $ref: '#/components/parameters/ViewAsUserGroup'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompleteClassListTasksInput'
            examples:
              completeSingleTask:
                summary: Complete a single task
                value:
                  carrierId: 1234
                  items:
                  - taskId: 5678
                    finalTrackId: 42
              completeMultipleTasks:
                summary: Complete multiple tasks at once
                value:
                  carrierId: 1234
                  items:
                  - taskId: 5678
                    finalTrackId: 42
                  - taskId: 5679
                    finalTrackId: 43
              completeWithTimestamp:
                summary: Complete with explicit timestamp
                value:
                  carrierId: 1234
                  completedAt: '2026-03-25T20:00:00Z'
                  items:
                  - taskId: 5678
                    finalTrackId: 42
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompleteClassListTasksOutput'
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
        '500':
          description: Internal Server Error
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      tags:
      - Ims
  /ims/equipment/inventory:
    post:
      summary: List railcar inventory
      description: 'Retrieves a list of railcar inventory items based on specified criteria (pagination, filters like loadStatus, station, track, etc.).


        Usage notes:

        - Pagination: Use pageSize, pageNextToken, and pagePrevToken to navigate paginated results.

        - Filtering: Combine multiple criteria (e.g., loadStatus, aarCarType, station, track, tag) to narrow results.

        - IDs: Station, track, and tag identifiers should come from the listStationTracks endpoint.'
      operationId: listInventory
      parameters:
      - $ref: '#/components/parameters/CarrierId'
      - $ref: '#/components/parameters/ViewAsUserGroup'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ListInventoryInput'
            examples:
              basic:
                summary: Basic pagination and filters
                value:
                  pageSize: 20
                  loadStatus: LOAD
                  station: 1001
              filterLoadStatusAndCarType:
                summary: Filter by load status and AAR car type
                value:
                  loadStatus: LOAD
                  aarCarType: GONDOLA
              stationTrackTag:
                summary: Filter by station, track, and tag
                value:
                  station: 1001
                  track: 2001
                  tag: 3001
              shipperConsignee:
                summary: Filter by shipper and consignee
                value:
                  shipper: Company A
                  consignee: Company B
              equipmentFilters:
                summary: Filter by equipment information
                value:
                  equipmentId: 12345
                  equipmentIds:
                  - 12345
                  - 67890
                  equipmentInitial: ABC
                  equipmentInitialsAndNumbers:
                  - - ABC
                    - 123
                  - - DEF
                    - 456
                  equipmentNumber: 789
              complex:
                summary: Complex query with multiple filters
                value:
                  pageSize: 50
                  loadStatus: EMPTY
                  station: 1002
                  track: 2002
                  shipper: Company C
                  carrierId: 555
                  equipmentIds:
                  - 98765
                  - 43210
                  equipmentInitial: XYZ
              groupingFilters:
                summary: Filter using intersected grouping filters
                value:
                  pageSize: 25
                  intersectedGroupFilters:
                  - groupingType: station
                    groupingIds:
                    - 1001
                    - 1002
                  - groupingType: track
                    names:
                    - Track A
                    - Track B
                  includeTrain: true
                  includeSwitchRequest: false
              consistAndTrain:
                summary: Filter by consist and train information
                value:
                  consistUuid: 123e4567-e89b-12d3-a456-426614174000
                  trainId: TRAIN123
                  includeTrain: true
                  includeSwitchRequest: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListInventoryOutput'
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
        '500':
          description: Internal Server Error
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      tags:
      - Ims
