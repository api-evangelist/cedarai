  /ims/equipment/move:
    post:
      summary: Update railcar inventory (move equipment)
      description: 'Move equipment between tracks/spots. Supports sequencing and batch moves.


        Usage notes:

        - Use to.grouping.resourceId to target a track and to.groupingIndex to control position (0 = front, -1 = back).

        - Provide updateIntermodalUnits=true to keep intermodal units in sync when moving equipment.'
      operationId: moveEquipment
      parameters:
      - $ref: '#/components/parameters/CarrierId'
      - $ref: '#/components/parameters/ViewAsUserGroup'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MoveEquipmentExternalInput'
            examples:
              moveToFront:
                summary: Move equipment to front of track
                value:
                  items:
                  - equipment:
                      resourceId: 1
                      resourceType: Equipment
                    locationUpdate:
                      from: {}
                      to: {}
                    updateIntermodalUnits: true
                  jobName: MOVE TO FRONT
              moveToBack:
                summary: Move equipment to back of track
                value:
                  items:
                  - equipment:
                      resourceId: 2
                      resourceType: Equipment
                    locationUpdate:
                      from: {}
                      to: {}
                    updateIntermodalUnits: true
                  jobName: MOVE TO BACK
              moveToMiddle:
                summary: Move equipment to middle of track
                value:
                  items:
                  - equipment:
                      resourceId: 3
                      resourceType: Equipment
                    locationUpdate:
                      from: {}
                      to:
                        groupingIndex: 5
                    updateIntermodalUnits: true
                  jobName: MOVE TO MIDDLE
              resequence:
                summary: Resequence a track
                value:
                  items:
                  - equipment:
                      resourceId: 2
                      resourceType: Equipment
                    locationUpdate:
                      from:
                        grouping:
                          resourceId: 4
                      to:
                        grouping:
                          resourceId: 4
                        groupingIndex: 0
                    updateIntermodalUnits: true
                  - equipment:
                      resourceId: 3
                      resourceType: Equipment
                    locationUpdate:
                      from:
                        grouping:
                          resourceId: 4
                      to:
                        grouping:
                          resourceId: 4
                        groupingIndex: 0
                    updateIntermodalUnits: true
                  - equipment:
                      resourceId: 1
                      resourceType: Equipment
                    locationUpdate:
                      from:
                        grouping:
                          resourceId: 4
                      to:
                        grouping:
                          resourceId: 4
                        groupingIndex: 0
                    updateIntermodalUnits: true
                  jobName: RESEQUENCE
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MoveEquipmentExternalOutput'
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
        '500':
          description: Internal Server Error
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      tags:
      - Ims
