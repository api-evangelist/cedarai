                  jobId: SWITCH-001
              filterByDateRange:
                summary: Filter by date range
                value:
                  carrierId: 1234
                  carrierDateRange:
                    startDate: '2024-01-01'
                    endDate: '2024-01-31'
              filterByTrackAndCustomer:
                summary: Filter by track and customer
                value:
