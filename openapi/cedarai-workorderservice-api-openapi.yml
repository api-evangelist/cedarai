      - PLLT
      - PUJI
      - RAMP
      - REBL
      - RECEIVED
      - RECONSIGN
      - REJS
      - RELEASED
      - REMB
      - RFLT
      - RICD
      - RLOD
      - RMTY
      - RRFS
      - RTAA
      - RTOI
      - RTPO
      - SCYC
