    v1TruckLoadTender:
      description: Truck Load Tender.
      properties:
        bol_handling_requirements:
          items:
            $ref: '#/components/schemas/v1BolHandlingRequirement'
          type: array
        business_instructions:
          items:
            $ref: '#/components/schemas/v1BusinessInstruction'
          type: array
        date_time_references:
          items:
            $ref: '#/components/schemas/v1DateTimeReference'
          type: array
        equipment_details:
          items:
            $ref: '#/components/schemas/armsEquipmentDetails'
          type: array
        interline_information:
          items:
            $ref: '#/components/schemas/v1InterlineInformation'
          type: array
        notes:
          items:
            $ref: '#/components/schemas/v1NoteOrSpecialInstruction'
          type: array
        scac:
          description: B202 contains the Standard Carrier Alpha Code (SCAC) of the carrier that will receive the load tender.
          type: string
        shipment_identification_number:
          type: string
        shipment_method_of_payment:
          $ref: '#/components/schemas/TruckLoadTenderShipmentMethodOfPayment'
        shipment_parties:
          items:
            $ref: '#/components/schemas/armsParty'
          type: array
        stop_off_details:
          items:
            $ref: '#/components/schemas/v1StopOffDetail'
          type: array
        total_weight:
          format: double
          type: number
        total_weight_qualifier:
          $ref: '#/components/schemas/v1TruckLoadTenderWeightQualifier'
        truck_load_tender_id:
          type: string
        weight_unit_code:
          $ref: '#/components/schemas/v1TruckLoadTenderWeightUnitCode'
      type: object
    armsPartyIdentificationCodeQualifier:
      enum:
      - DUNS
      - DUNS_PLUS_4
      - TELEPHONE_NUMBER
      - ABI_ROUTING_CODE
      - SPLC
      - CBSA_AUTOMOTIVE_ID
      - BROKER_FILER_ID
      - CRA_BUSINESS_NUMBER
      - CIF_NUMBER
      - FEDERAL_TAXPAYER_ID
      - JURISDICTION_CODE
      - ORIGIN_ASSIGNED_CODE
      - MUTUALLY_DEFINED
      type: string
    armsBillingInformation:
      properties:
        carrier_codes:
          items:
            type: string
          type: array
        destination:
          $ref: '#/components/schemas/armsWaybillStation'
        origin:
          $ref: '#/components/schemas/armsWaybillStation'
        rebill_reason_code:
          $ref: '#/components/schemas/armsRebillReasonCode'
      type: object
    TruckLoadTenderStopReasonCode:
      description: Codes specifying the reason for a stop.
      enum:
      - COMPLETE
      - COMPLETE_UNLOAD
      - LOAD
      - PART_LOAD
      - PART_UNLOAD
      - UNLOAD
      type: string
    armsEquipmentShipmentInformation:
      properties:
        description:
          type: string
        extended_reference_info:
          items:
            $ref: '#/components/schemas/armsExtendedReferenceInformation'
          type: array
        line_items:
          items:
            $ref: '#/components/schemas/armsEquipmentLineItem'
          type: array
        reference_id:
          type: string
        reference_id_qualifier:
          type: string
      type: object
    armsExtendedReferenceInformation:
      properties:
        description:
          type: string
        reference_id:
          type: string
        reference_id_qualifier:
          type: string
        reference_timestamp:
          format: date-time
          type: string
      type: object
    v1LadingDescription:
      properties:
        commodity_code:
          type: string
        commodity_code_qualifier:
          type: string
        lading_description:
          type: string
        lading_line_item_number:
          type: string
        packaging_code:
          type: string
      type: object
    v1DeleteTruckLoadTenderResponse:
      type: object
    armsAdministrativeContact:
      properties:
        communication_numbers:
          items:
            $ref: '#/components/schemas/armsCommunicationNumber'
          type: array
        contact_function_code:
          type: string
        contact_inquiry_reference:
          type: string
        name:
          type: string
      type: object
    v1TruckLoadTenderWeightUnitCode:
      description: Codes specifying weight units.
      enum:
      - METRIC_TON
      - GRAMS
      - KILOGRAMS
      - POUNDS
      - MEASUREMENT_TON
      - OUNCES
      - SHORT_TON
      - LONG_TON
      type: string
    protobufAny:
      additionalProperties:
        type: object
      properties:
        '@type':
          type: string
      type: object
    armsEquipmentLineItem:
      properties:
        cbp_barcode_number:
          type: string
        commodity_code:
          type: string
        commodity_code_qualifier:
          type: string
        commodity_description:
          type: string
        currency_code:
          type: string
        customs_shipment_value:
          format: int32
          type: integer
        destination_country_code:
          type: string
        marks_and_numbers:
          type: string
        origin_country_code:
          type: string
        quantity:
          format: double
          type: number
        smallest_exterior_package_type:
          type: string
        weight:
          format: float
          type: number
        weight_unit_code:
          type: string
      type: object
    v1ShipmentWeightPackagingQuantityData:
      properties:
        lading_quantity:
          format: double
          type: number
        lading_quantity_2:
          format: double
          type: number
        weight:
          format: double
          type: number
        weight_2:
          format: double
          type: number
        weight_qualifier:
          type: string
        weight_qualifier_2:
          type: string
        weight_unit_code:
          $ref: '#/components/schemas/v1TruckLoadTenderWeightUnitCode'
      type: object
    armsWeightType:
      enum:
      - WT_ACTUAL
      type: string
    v1BusinessInstruction:
      properties:
        description:
          type: string
        reference_identification:
          type: string
        reference_identification_qualifier:
          description: Kept as the raw X12 qualifier string to support the broad/open-ended L11 qualifier list.
          type: string
      type: object
    TruckLoadTenderShipmentMethodOfPayment:
      description: Codes identifying payment terms for transportation charges.
      enum:
      - COLLECT
      - PREPAID
      type: string
    v1UpdateTruckLoadTenderResponse:
      properties:
        truck_load_tender:
          $ref: '#/components/schemas/v1TruckLoadTender'
      type: object
    armsEquipmentDetails:
      properties:
        aar_car_type:
          type: string
        carrier_code:
          type: string
        chassis_initial:
          type: string
        chassis_number:
          format: uint64
          type: string
        check_digit:
          format: int64
          type: integer
        description_code:
          type: string
        dunnage:
          format: int64
          type: integer
        dunnage_measure:
          $ref: '#/components/schemas/cedaraiIntWeightMeasurement'
        equipment_initial:
          type: string
        equipment_name:
          type: string
        equipment_number:
          format: uint64
          type: string
        equipment_ordered:
          $ref: '#/components/schemas/armsEquipmentOrdered'
        gross_weight_lbs:
          format: int64
          type: integer
        gross_weight_measure:
          $ref: '#/components/schemas/cedaraiIntWeightMeasurement'
        height_in:
          format: int64
          type: integer
        height_measure:
          $ref: '#/components/schemas/cedaraiIntLengthMeasurement'
        interchange_move_authorities:
          items:
            $ref: '#/components/schemas/armsInterchangeMoveAuthority'
          type: array
        iso_container_code:
          type: string
        length_in:
          format: int64
          type: integer
        length_measure:
          $ref: '#/components/schemas/cedaraiIntLengthMeasurement'
        net_weight_lbs:
          format: int64
          type: integer
        net_weight_measure:
          $ref: '#/components/schemas/cedaraiIntWeightMeasurement'
        ownership_code:
          type: string
        owning_carrier_code:
          type: string
        position:
          type: string
        seal_numbers:
          items:
            type: string
          type: array
        shipment_info:
          items:
            $ref: '#/components/schemas/armsEquipmentShipmentInformation'
          type: array
        tare_qualifier_code:
          type: string
        tare_weight_lbs:
          format: int64
          type: integer
        tare_weight_measure:
          $ref: '#/components/schemas/cedaraiIntWeightMeasurement'
        terminals:
          items:
            $ref: '#/components/schemas/armsTerminal'
          type: array
        weight_allowance:
          format: int64
          type: integer
        weight_allowance_measure:
          $ref: '#/components/schemas/cedaraiIntWeightMeasurement'
        weight_type:
          $ref: '#/components/schemas/armsWeightType'
        width_in:
          format: int64
          type: integer
        width_measure:
          $ref: '#/components/schemas/cedaraiIntLengthMeasurement'
      type: object
    cedaraiIntWeightMeasurement:
      properties:
        unit:
          type: string
        value:
          format: int32
          type: integer
      type: object
    v1BolHandlingRequirement:
      properties:
        special_handling_code:
          $ref: '#/components/schemas/TruckLoadTenderSpecialHandlingCode'
        special_handling_description:
          type: string
      type: object
    armsReferenceInfo:
      properties:
        description:
          type: string
        reference_id:
          type: string
        reference_id_qualifier:
          type: string
      type: object
    v1UpdateTruckLoadTenderRequest:
      properties:
        truck_load_tender:
          $ref: '#/components/schemas/v1TruckLoadTender'
      type: object
    v1CreateTruckLoadTenderResponse:
      properties:
        truck_load_tender:
          $ref: '#/components/schemas/v1TruckLoadTender'
      type: object
    v1NoteOrSpecialInstruction:
      properties:
        description:
          type: string
        note_reference_code:
          $ref: '#/components/schemas/TruckLoadTenderNoteReferenceCode'
      type: object
    v1TruckLoadTenderWeightQualifier:
      description: Weight qualifier codes used for total shipment weight.
      enum:
      - SHIPPER_WEIGHT
      - BILLED_WEIGHT
      - ACTUAL_NET_WEIGHT_FOR_COMBINATION
      - ESTIMATED_NET_WEIGHT
      - GROSS_WEIGHT
      - LIGHT_WEIGHT
      - CLEAN_OUT
      - LEGAL_WEIGHT
      - MINIMUM_WEIGHT
      - ACTUAL_NET_WEIGHT
      - EXCESS_WEIGHT
      - STATE_WEIGHT
      - MAXIMUM_WEIGHT
      type: string
    v1DeleteTruckLoadTenderRequest:
      properties:
        name:
          type: string
      type: object
    TruckLoadTenderSpecialHandlingCode:
      description: Codes specifying special transportation handling instructions.
      enum:
      - ADVANCE_APPOINTMENT
      - DELIVERY_APPOINTMENT
      - EXPORT
      type: string
    v1DateTimeReference:
      properties:
        date:
          type: string
        date_qualifier:
          $ref: '#/components/schemas/TruckLoadTenderDateQualifier'
        time:
          type: string
        time_code:
          type: string
        time_qualifier:
          type: string
      type: object
    armsRebillReasonCode:
      enum:
      - RRC_COLLECT
      - RRC_PREPAID
      type: string
    armsWaybillStation:
      properties:
        city_name:
          type: string
        country_code:
          type: string
        fsac:
          type: string
        postal_code:
          type: string
        splc:
          type: string
        state_or_province:
          type: string
      type: object
    v1InterlineInformation:
      properties:
        routing_sequence_code:
          type: string
        scac:
          type: string
        state_or_province_code:
          type: string
        transportation_method_type_code:
          type: string
      type: object
    armsTerminal:
      properties:
        location_identifier:
          type: string
        location_qualifier:
          type: string
        port_name:
          type: string
        terminal_function_code:
          type: string
      type: object
    v1ListTruckLoadTenderResponse:
      properties:
        next_page_token:
          type: string
        truck_load_tenders:
          items:
            $ref: '#/components/schemas/v1TruckLoadTender'
          type: array
      type: object
    armsPartyEntityIdentifierCode:
      enum:
      - PARTY_TO_BE_BILLED
      - ORIGIN_PARTY
      - DESTINATION_PARTY
      - BENEFICIAL_OWNER
      - BILL_TO
      - IN_CARE_OF_1
      - CUSTOMS_BROKER
      - CHASSIS_PROVIDER
      - CONSIGNEE
      - CONVERTER
      - DESTINATION_MAIL_FACILITY
      - FORWARDER
      - IMPORTER
      - MOTOR_CARRIER
      - NOTIFY_PARTY_1
      - NOTIFY_PARTY_2
