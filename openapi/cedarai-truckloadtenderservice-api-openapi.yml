      - EST_NEXT_PROMO_DATE_START
      - EST_NEXT_PROMO_DATE_END
      - EST_NEXT_PROMO_SHIP_DATE_START
      - ESTIMATED_NEXT_PROMOTION_SHIP_DATE_END
      - BILL_OF_LADING
