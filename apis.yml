aid: cedarai
name: Cedarai
description: >-
  Cedar AI builds ARMS (Automated Rail Management System), a cloud-native, AI-powered
  transportation management platform for railroads, industrial shippers, transload and
  intermodal terminals, and fleet/car owners. The ARMS External API exposes REST and gRPC
  services for railcar inventory and history, waybills and bills of lading, work orders and
  train movements, switching and class lists, charges, shipper invoices and quotes, truck
  load tenders, network structure, and threaded notes (Linda) with AI summaries — plus
  Ed25519-signed webhooks for real-time operational events, across US (cedarai.com) and EU
  (cedarai.se) regions. Backed by Felicis.
